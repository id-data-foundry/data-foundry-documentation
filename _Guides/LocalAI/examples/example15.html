        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Local AI Example 15: Tool Calls</title>
        <link
            rel="stylesheet"
            href="/assets/stylesheets/picoCSS/pico.jade.min.css"
        />
        <script src="/assets/javascripts/local-ai/latest/local-ai.min.js"></script>
        <script src="/assets/javascripts/marked.min.js"></script>
        <!-- Import OOCSI library for web -->
        <script src="/assets/javascripts/oocsi-web.min.js"></script>
        <style>
            /* Markdown styling adjustments */
            #result > :first-child { margin-top: 0; }
            #result > :last-child { margin-bottom: 0; }
            pre { white-space: pre-wrap; font-size: 0.95em; padding: 0.5rem; background-color: rgba(0,0,0,0.05); }
            code { font-size: 0.95em; }
        </style>
    </head>
    <body>
        <main class="container">
            <h1>Example 15: Tool Calls (Function Calling)</h1>

            <p>
                Talk to the OOCSI Assistant. You can ask it to send messages to specific channels. The LLM will trigger the <code>sendOOCSIMessage</code> tool when appropriate.
            </p>

            <div class="grid">
                <p>
                    <label>OOCSI Server:</label>
                    <input type="text" id="server" value="wss://hello.oocsi.net/ws" />
                </p>
                <p>
                    <label>Your Message:</label>
                    <input type="text" id="prompt" value="Send a greenish lighting scene to the system." />
                </p>
            </div>
            <p>
                <button id="submitBtn">Talk to Assistant</button>
            </p>

            <hr />

            <h3>Assistant Response</h3>
            <div id="result" style="background: #f4f4f4; padding: 1rem; border-radius: 8px; min-height: 3rem;"></div>
            
            <h3>Tool Execution Log</h3>
            <div id="log" style="font-family: monospace; font-size: 0.9rem;"></div>

            <script type="module">
                let connectedServer = null;

                // Define the tool schema
                const tools = [
                    {
                        type: "function",
                        function: {
                            name: "sendOOCSIMessage",
                            description: "Send a message to an OOCSI channel",
                            parameters: {
                                type: "object",
                                properties: {
                                    channel: {
                                        type: "string",
                                        description: "The name of the OOCSI channel"
                                    },
                                    data: {
                                        type: "object",
                                        description: "The data to send as a JSON object"
                                    }
                                },
                                required: ["channel", "data"]
                            }
                        }
                    }
                ];

                document
                    .querySelector("#submitBtn")
                    .addEventListener("click", async (e) => {
                        const btn = document.querySelector("#submitBtn");
                        const resultDiv = document.querySelector("#result");
                        const logDiv = document.querySelector("#log");

                        btn.setAttribute("disabled", true);
                        resultDiv.innerText = "Assistant is thinking...";
                        logDiv.innerHTML = "";

                        const prompt = document.querySelector("#prompt").value;
                        const server = document.querySelector("#server").value;

                        // Connect to OOCSI
                        if (connectedServer !== server) {
                            OOCSI.connect(server);
                            connectedServer = server;
                        }

                        // Send request with tools
                        const response = await foundry.textToTextWithUsage({
                            api_token: "YOUR_API_KEY",
                            model: "qwen/qwen3.5-9b", // Use a model known for tool calling
                            messages: [
                                { role: "system", content: "You are a helpful OOCSI assistant. If the user describes a lighting scene, use the sendOOCSIMessage tool to send the corresponding brightness, color, and status to the 'smart_lights' channel. Confirm the action to the user." },
                                { role: "user", content: prompt }
                            ],
                            tools: tools,
                            toolChoice: "auto",
                            logging: true,
                            loadingElementSelector: "#submitBtn"
                        });

                        btn.removeAttribute("disabled");

                        if (response) {
                            if (response.text) {
                                resultDiv.innerHTML = marked.parse(response.text);
                            } else {
                                resultDiv.innerText = response.toolCalls ? "Executing tools..." : "No response.";
                            }
                        
                            // Handle tool calls
                            if (response.toolCalls && response.toolCalls.length > 0) {
                                for (const toolCall of response.toolCalls) {
                                    if (toolCall.function.name === "sendOOCSIMessage") {
                                        try {
                                            const args = JSON.parse(toolCall.function.arguments);
                                            logDiv.innerHTML += `<div><b>Calling tool:</b> sendOOCSIMessage</div>`;
                                            logDiv.innerHTML += `<div><b>Channel:</b> ${args.channel}</div>`;
                                            logDiv.innerHTML += `<div><b>Data:</b> ${JSON.stringify(args.data)}</div>`;
                                            
                                            // Actual OOCSI send
                                            OOCSI.send(args.channel, args.data);
                                            
                                            logDiv.innerHTML += `<div><mark>SUCCESS: Message sent to OOCSI</mark></div><br>`;
                                        } catch (err) {
                                            logDiv.innerHTML += `<div style="color:red;">Error parsing tool arguments: ${err.message}</div>`;
                                        }
                                    }
                                }
                            }
                        }
                    });
            </script>
        </main>
    </body>
