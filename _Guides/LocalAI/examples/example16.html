  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local AI Example 16</title>
  <link rel="stylesheet" href="/assets/stylesheets/picoCSS/pico.jade.min.css">
  <script src="/assets/javascripts/local-ai/latest/local-ai.min.js"></script>
  <script src="/assets/javascripts/marked.min.js"></script>
  <style>
    /* Markdown styling adjustments */
    #result > :first-child { margin-top: 0; }
    #result > :last-child { margin-bottom: 0; }
    pre { white-space: pre-wrap; font-size: 0.95em; padding: 0.5rem; background-color: rgba(0,0,0,0.05); }
    code { font-size: 0.95em; }
    
    /* Cursor animation for streaming effect */
    .streaming::after {
      content: '▊';
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink {
      to { visibility: hidden; }
    }
  </style>
</head>
<body>
  <main class="container">

    <h1>Example 16: Streaming Responses</h1>

    <p>
      Streaming allows for a more interactive experience by showing the response as it's being generated. 
      This is especially useful for long responses.
    </p>

    <textarea id="prompt" rows="6">Write a short poem about a designer artfully choosing ice-cream.</textarea>

    <div class="grid">
      <p>
        <button id="submitBtn">Submit</button>
      </p>
      <details>
        <summary>Extra settings</summary>
        <p>
          <label>Temperature:</label>
          <input type="range" id="temperature" min="0.0" value="0.9" max="2.0" step="0.1">
        </p>
      </details>
    </div>

    <p id="result"></p>

    <script type="module">

      // listen to button clicks and handle them
      document.querySelector('#submitBtn').addEventListener('click', async (e) => {

        // prevent double submission and set loading indicator
        document.querySelector('#submitBtn').setAttribute('disabled', true)
        
        // remove previous result and add streaming class
        const resultElem = document.querySelector('#result');
        resultElem.innerText = "";
        resultElem.classList.add('streaming');

        // retrieve prompt
        const prompt = document.querySelector('#prompt').value;
        // retrieve temperature
        const temperature = parseFloat(document.querySelector('#temperature').value);

        // send request with stream: true
        const result = await foundry.textToText({
          api_token: "YOUR_API_KEY",
          model: "hermes-2-pro-llama-3-8b",
          messages: [{role: "user", content: prompt}],
          temperature: temperature,
          stream: true,
          // We can use resultElementSelector to let the library handle basic appending
          resultElementSelector: "#result",
          // Or we can use onChunk for more custom behavior
          onChunk: (chunk) => {
             // In this example, we let the library append to #result
             // but we could do other things here too
          },
          loadingElementSelector: '#result',
          logging: false
        });
        
        // Once finished, remove streaming cursor and render markdown
        resultElem.classList.remove('streaming');
        const rawText = resultElem.textContent;
        resultElem.innerHTML = marked.parse(rawText);

        // enable submit button again
        document.querySelector('#submitBtn').removeAttribute('disabled')
      });
    </script>
  </main>
</body>
</html>
