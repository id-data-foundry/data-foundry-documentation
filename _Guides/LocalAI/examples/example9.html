        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Local AI Example 9</title>
        <link
            rel="stylesheet"
            href="/assets/stylesheets/picoCSS/pico.jade.min.css"
        />
        <script src="/assets/javascripts/local-ai/latest/local-ai.min.js"></script>
        <script src="/assets/javascripts/marked.min.js"></script>
        <style>
            /* Markdown styling adjustments */
            #resultText > :first-child { margin-top: 0; }
            #resultText > :last-child { margin-bottom: 0; }
            pre { white-space: pre-wrap; font-size: 0.95em; padding: 0.5rem; background-color: rgba(0,0,0,0.05); }
            code { font-size: 0.95em; }
        </style>
    </head>
    <body>
        <main class="container">
            <h1>Example 9: translate and speak</h1>

            <p>
                Just ask type some text. Anything. And listen to the
                <b>italian</b> voices. 🤌
            </p>

            <textarea id="prompt" rows="6">
What is the culturally-appropriate choice if you can only pick one ice-cream flavor?</textarea
            >

            <div class="grid">
                <p>
                    <button id="submitBtn">Submit</button>
                </p>
            </div>

            <div id="resultText" style="margin-top: 1rem;"></div>
            <audio
                id="result"
                controls
                style="width: 100%; margin-top: 1rem; display: none;"
            ></audio>

            <script type="module">
                // listen to button clicks and handle them
                document
                    .querySelector("#submitBtn")
                    .addEventListener("click", async (e) => {
                        // prevent double submission and set loading indicator
                        document
                            .querySelector("#submitBtn")
                            .setAttribute("disabled", true);
                        const resultTextEl = document.querySelector("#resultText");
                        resultTextEl.innerText = "";

                        // retrieve prompt
                        const prompt = document.querySelector("#prompt").value;

                        // send request
                        let translated = await foundry.textToText({
                            // optional: server (ex. "https://data-foundry.net")
                            server: "",
                            // generate your own API token on Data Foundry
                            api_token: "YOUR_API_KEY",
                            // select the model (e.g. "translate", "default", or a specific model ID)
                            model: "translate",
                            // submit the prompt as a user message
                            messages: [
                                {
                                    role: "user",
                                    content:
                                        "translate the following text accurately to proper Italian: " +
                                        prompt,
                                },
                            ],
                            loadingElementSelector: "#submitBtn",
                            // no logging on console needed
                            logging: false,
                        });

                        if (translated) {
                            resultTextEl.innerHTML = marked.parse(translated);

                            // send speech generation request
                            await foundry.textToSpeech({
                                // optional: server (ex. "https://data-foundry.net")
                                server: "",
                                // generate your own API token on Data Foundry
                                api_token: "YOUR_API_KEY",
                                // submit the prompt
                                prompt: translated,
                                language: "it",
                                // choose a voice from: https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md
                                voice: "im_nicola",
                                // fill results in the HTML element with the id "result"
                                resultElementSelector: "#result",
                                // loading indicator on submit button
                                loadingElementSelector: "#submitBtn",
                                // no logging on console needed
                                logging: false,
                            });

                            const audioEl = document.querySelector("#result");
                            if (audioEl && audioEl.src) {
                                audioEl.style.display = "block";
                            }
                        }

                        // enable submit button again
                        document
                            .querySelector("#submitBtn")
                            .removeAttribute("disabled");
                    });
            </script>
        </main>
    </body>
</html>
