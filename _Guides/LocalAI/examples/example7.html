        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Local AI Example 7</title>
        <link
            rel="stylesheet"
            href="/assets/stylesheets/picoCSS/pico.jade.min.css"
        />
        <script src="/assets/javascripts/local-ai/latest/local-ai.min.js"></script>
    </head>
    <body>
        <main class="container">
            <h1>Example 7: text to speech</h1>

            <p>
                Just ask type some text. Anything. And listen to the voices. 🙄
            </p>

            <textarea id="prompt" rows="6">
What is the culturally-appropriate choice if you can only pick one ice-cream flavor?</textarea
            >

            <div class="grid">
                <div>
                    <label for="voiceSelect">Model &amp; Voice</label>
                    <select id="voiceSelect">
                        <optgroup label="Robotic">
                            <option value="robot:retro" selected>Robot - Computer</option>
                            <option value="robot:dalek">Robot - Dalek (Ring Modulation)</option>
                            <option value="robot:cyborg">Robot - Cyborg (Metallic Flanger)</option>
                            <option value="robot:vintage">Robot - Vintage 8-bit (SAM)</option>
                        </optgroup>
                        <optgroup label="Neural (Kokoro)">
                            <option value="kokoro:af_heart">Kokoro - Heart (Female)</option>
                            <option value="kokoro:af_bella">Kokoro - Bella (Female)</option>
                            <option value="kokoro:am_adam">Kokoro - Adam (Male)</option>
                            <option value="kokoro:am_michael">Kokoro - Michael (Male)</option>
                            <option value="kokoro:bf_emma">Kokoro - Emma (British Female)</option>
                            <option value="kokoro:bm_george">Kokoro - George (British Male)</option>
                        </optgroup>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <button id="submitBtn">Submit</button>
                </div>
            </div>

            <audio id="result" controls style="width: 100%; margin-top: 1rem; display: none;"></audio>

            <script type="module">
                // listen to button clicks and handle them
                document
                    .querySelector("#submitBtn")
                    .addEventListener("click", async (e) => {
                        // prevent double submission and set loading indicator
                        document
                            .querySelector("#submitBtn")
                            .setAttribute("disabled", true);

                        // retrieve prompt and selected voice/model
                        const prompt = document.querySelector("#prompt").value;
                        const [model, voice] = document.querySelector("#voiceSelect").value.split(":");

                        // send request
                        await foundry.textToSpeech({
                            // optional: server (ex. "https://data-foundry.net")
                            server: "",
                            // generate your own API token on Data Foundry
                            api_token: "YOUR_API_KEY",
                            // submit the prompt
                            prompt: prompt,
                            // model selection: "robot" or "kokoro"
                            model: model,
                            // voice preset
                            voice: voice,
                            // fill results in the HTML element with the id "result"
                            resultElementSelector: "#result",
                            // loading indicator element
                            loadingElementSelector: "#submitBtn",
                            // no logging on console needed
                            logging: false,
                        });

                        // display audio player once loaded
                        const audioEl = document.querySelector("#result");
                        if (audioEl.src) {
                            audioEl.style.display = "block";
                        }

                        // enable submit button again
                        document
                            .querySelector("#submitBtn")
                            .removeAttribute("disabled");
                    });
            </script>
        </main>
    </body>
</html>
